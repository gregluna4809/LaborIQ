spring:
  application:
    name: laboriq
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/laboriq}
    username: ${SPRING_DATASOURCE_USERNAME:laboriq}
    password: ${SPRING_DATASOURCE_PASSWORD:laboriq}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

laboriq:
  admin:
    api-key: ${LABORIQ_ADMIN_API_KEY:}
  bls:
    base-url: ${BLS_BASE_URL:https://api.bls.gov/publicAPI/v2}
    registration-key: ${BLS_API_KEY:}
    sample-runner-enabled: ${BLS_SAMPLE_RUNNER_ENABLED:true}
    persist-sample-enabled: ${BLS_PERSIST_SAMPLE_ENABLED:false}
    request-timeout: ${BLS_REQUEST_TIMEOUT:10s}
    sample-series-ids:
      - ${BLS_SAMPLE_SERIES_ID:WMU00140201020000001300002500}
    sample-soc-code: ${BLS_SAMPLE_SOC_CODE:13-0000}
    sample-occupation-title: ${BLS_SAMPLE_OCCUPATION_TITLE:Business and Financial Operations Occupations}
    oews:
      local-file-path: ${BLS_OEWS_LOCAL_FILE_PATH:}
      dataset-url: ${BLS_OEWS_DATASET_URL:https://www.bls.gov/oes/special.requests/oesm25nat.zip}
      year: ${BLS_OEWS_YEAR:2025}

server:
  port: 8081
